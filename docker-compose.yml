services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_DEVDOCS_URL: http://localhost:9292
    ports:
      - "5001:5001"
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_ADMIN_ROLE_ID: ${DISCORD_ADMIN_ROLE_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
    volumes:
      # Persist each event's built participant documents to the host on event end.
      - ./results:/app/results
    depends_on:
      - devdocs

  devdocs:
    build:
      context: .
      dockerfile: devdocs.Dockerfile
    ports:
      - "9292:9292"
